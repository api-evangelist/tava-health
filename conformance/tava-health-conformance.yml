    supporting_document: https://www.tavahealth.com/notice-of-privacy-practices
    supporting_detail: >-
      A HIPAA Notice of Privacy Practices is a document the Privacy Rule REQUIRES a covered entity
      to publish, so its existence is itself substantive evidence rather than a marketing claim.
