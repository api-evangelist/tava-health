description: >-
  Compliance posture Tava Health publishes about itself. Tava is a US digital behavioral-health
  company, so its governing regime is HIPAA; it states HIPAA and SOC 2 Type II compliance on every
  page of its marketing site and publishes a HIPAA-mandated Notice of Privacy Practices. No
  technical/domain standard conformance can be asserted, because no machine-readable contract is
  published for this pass to read.
