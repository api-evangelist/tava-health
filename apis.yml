aid: tava-health
name: Tava Health
description: >-
  Tava Health, Inc. is a Utah-founded (2019) digital behavioral-health company that sells mental
  health care as an employer and health-plan benefit. Employers, health plans and provider groups
  contract with Tava; covered members are matched to a licensed therapist — typically within about
  twelve hours — and receive care over secure video or in person through a nationwide clinical
  network. Care is delivered by Tava Professionals, a set of state-level professional entities that
  act as the HIPAA covered entity, while Tava Health, Inc. operates the technology platform as their
  business associate. The platform runs as two portals: a client portal at care.tavahealth.com for
  members and a provider/administrative portal at app.tavahealth.com for therapists and plan
  administrators. Tava also runs DirectCare, a partner-facing product with its own developer hub at
  docs.tavahealth.com; that hub is a ReadMe.io site and is password-protected, so no public API
  reference, OpenAPI definition or other machine-readable contract is available at this time.
